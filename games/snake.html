<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;background:#0f1115;color:#e8e8e8;font-family:system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  canvas{background:#171a21;border-radius:12px;max-width:94vw;max-height:78vh;touch-action:none}
  #info{font-size:16px;opacity:.8}
</style>
</head>
<body>
<div id="info">Score: 0 · Best: 0</div>
<canvas id="c" width="480" height="480"></canvas>
<div id="info2" style="opacity:.5;font-size:14px">Arrow keys / WASD, or swipe. Space to pause.</div>
<script>
(function () {
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), info = document.getElementById("info");
  var N = 20, S = canvas.width / N, best = 0, snake, dir, nextDir, food, score, paused, dead, timer;
  try { best = Number(localStorage.getItem("snake-best")) || 0; } catch (e) {}

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = nextDir = { x: 1, y: 0 };
    score = 0; paused = false; dead = false;
    placeFood(); updateInfo();
    clearInterval(timer); timer = setInterval(step, 110);
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(function (p) { return p.x === food.x && p.y === food.y; }));
  }
  function updateInfo() { info.textContent = "Score: " + score + " · Best: " + best + (paused ? " · Paused" : ""); }
  function step() {
    if (paused || dead) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(function (p) { return p.x === head.x && p.y === head.y; })) {
      dead = true;
      if (score > best) { best = score; try { localStorage.setItem("snake-best", best); } catch (e) {} }
      updateInfo(); draw(); return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; placeFood(); updateInfo(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff5c7a";
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.6, 0, Math.PI * 2); ctx.fill();
    snake.forEach(function (p, i) {
      ctx.fillStyle = i === 0 ? "#7da2ff" : "#4f7cff";
      ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
    });
    if (dead) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center";
      ctx.font = "bold 36px system-ui"; ctx.fillText("Game over", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "18px system-ui"; ctx.fillText("Press any key or tap to restart", canvas.width / 2, canvas.height / 2 + 26);
    }
  }
  function turn(x, y) { if (x !== -dir.x || y !== -dir.y) nextDir = { x: x, y: y }; }

  var keys = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  document.addEventListener("keydown", function (e) {
    if (dead) { reset(); return; }
    if (e.key === " ") { paused = !paused; updateInfo(); e.preventDefault(); return; }
    var k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { turn(k[0], k[1]); e.preventDefault(); }
  });
  var sx, sy;
  canvas.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; if (dead) reset(); });
  canvas.addEventListener("pointerup", function (e) {
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  reset(); draw();
})();
</script>
</body>
</html>
